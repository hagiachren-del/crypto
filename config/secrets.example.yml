# Secrets Configuration
# Copy this file to secrets.yml and add your API keys
# NEVER commit secrets.yml to version control
# Add to .gitignore: config/secrets.yml

# ==================== EXCHANGE API CREDENTIALS ====================

# MEXC Exchange (Primary)
mexc:
  api_key: "your_mexc_api_key_here"
  api_secret: "your_mexc_api_secret_here"
  # Get API keys from: https://www.mexc.com/user/openapi

# Binance (Alternative)
binance:
  api_key: "your_binance_api_key_here"
  api_secret: "your_binance_api_secret_here"
  testnet: true  # Use testnet for testing

# Other exchanges (add as needed)
# coinbase:
#   api_key: "your_coinbase_api_key"
#   api_secret: "your_coinbase_api_secret"

# kraken:
#   api_key: "your_kraken_api_key"
#   api_secret: "your_kraken_api_secret"

# ==================== AI SERVICES ====================

# Claude AI (Anthropic) - For AI-powered market analysis
# Get your API key from: https://console.anthropic.com/
claude:
  api_key: "your_anthropic_api_key_here"
  # Example: sk-ant-api03-xxxxx...

# Alternative: OpenAI (optional)
# openai:
#   api_key: "your_openai_api_key"

# ==================== NOTIFICATIONS ====================

# Telegram Bot (Recommended for trade alerts)
# Setup: https://core.telegram.org/bots#creating-a-new-bot
telegram:
  bot_token: "your_telegram_bot_token"  # From @BotFather
  chat_id: "your_telegram_chat_id"      # Your chat ID or group ID
  # To get your chat_id: Message @userinfobot

# Discord Webhooks (Optional)
discord:
  webhook_url: "your_discord_webhook_url"
  # Create webhook in Discord server settings

# Email Notifications (Optional)
email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender: "your-email@gmail.com"
  password: "your_app_password"  # Use app password for Gmail
  # Gmail setup: https://support.google.com/accounts/answer/185833

# ==================== DATABASE ====================

# PostgreSQL (Production - Optional)
# postgres:
#   host: "localhost"
#   port: 5432
#   database: "crypto_trading"
#   username: "trader"
#   password: "your_secure_password"

# ==================== EXTERNAL SERVICES ====================

# News API (Optional - for sentiment analysis)
# newsapi:
#   api_key: "your_newsapi_key"

# CoinGecko API (Optional - for additional market data)
# coingecko:
#   api_key: "your_coingecko_api_key"

# ==================== SECURITY NOTES ====================
#
# 1. Never commit this file with real credentials
# 2. Use environment variables in production
# 3. Rotate API keys regularly (every 90 days)
# 4. Use IP restrictions when available
# 5. Enable 2FA on all exchange accounts
# 6. Set appropriate API permissions (no withdrawal for trading bot)
# 7. Start with testnet/paper trading
# 8. Monitor API usage and rate limits
